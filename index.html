<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Marcos Pereira 1010</title>
  <meta name="description" content="Crie seu avatar com o filtro da campanha Marcos Pereira 1010." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f3f8ff 0%, #dfeeff 100%);
      min-height: 100vh;
      color: #0e2b57;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: #ffe600;
      color: #1d1976;
      font-weight: 900;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.05;
      margin-bottom: 12px;
      color: #063d80;
    }

    .subtitle {
      max-width: 680px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.5;
      color: #35507c;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 24px;
      align-items: start;
      margin-top: 32px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(6, 61, 128, 0.14);
    }

    .preview-card {
      padding: 18px;
    }

    .controls-card {
      padding: 24px;
    }

    .preview-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 18px;
      background: #dfe8f1;
      cursor: grab;
      touch-action: none;
    }

    .preview-wrap:active {
      cursor: grabbing;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-canvas {
      pointer-events: none;
    }

    .controls-card h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #063d80;
    }

    .controls-card p {
      font-size: 15px;
      line-height: 1.5;
      color: #476182;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #12366b;
    }

    .field input[type="file"],
    .field input[type="range"] {
      width: 100%;
    }

    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: #063d80;
      color: white;
    }

    .secondary {
      background: #eef4fb;
      color: #063d80;
    }

    .tip {
      margin-top: 18px;
      background: #f4f8fd;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #48627f;
    }

    .note {
      text-align: center;
      font-size: 13px;
      color: #57708d;
      margin-top: 14px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .controls-card {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">EU VOTO MARCOS PEREIRA 1010</div>
      <h1>Crie seu avatar com o filtro da campanha</h1>
      <p class="subtitle">
        Envie sua foto, ajuste a posição e o zoom se necessário, depois baixe a imagem pronta para usar nas redes sociais.
      </p>
    </header>

    <section class="grid">
      <div class="card preview-card">
        <div class="preview-wrap" id="previewWrap">
          <canvas id="photoCanvas"></canvas>
          <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
        </div>
        <div class="note">Arraste a foto para posicionar melhor dentro da moldura.</div>
      </div>

      <aside class="card controls-card">
        <h2>Montar avatar</h2>
        
        <div class="field">
          <label for="uploadInput">Escolher foto</label>
          <input id="uploadInput" type="file" accept="image/*" />
        </div>

        <div class="field">
          <label for="zoomInput">Zoom</label>
          <input id="zoomInput" type="range" min="0.6" max="2.5" step="0.01" value="1" />
        </div>

        <div class="buttons">
          <button class="primary" id="downloadBtn" type="button">Baixar avatar</button>
          <button class="secondary" id="resetBtn" type="button">Reiniciar ajuste</button>
        </div>
      </aside>
    </section>
  </div>

  <script>
    const photoCanvas = document.getElementById("photoCanvas");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const photoCtx = photoCanvas.getContext("2d");
    const overlayCtx = overlayCanvas.getContext("2d");

    const previewWrap = document.getElementById("previewWrap");
    const uploadInput = document.getElementById("uploadInput");
    const zoomInput = document.getElementById("zoomInput");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");

    const baseSize = 1080;

    const photoImg = new Image();
    const overlayImg = new Image();

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let savedOffsetX = 0;
    let savedOffsetY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function setupCanvas() {
      photoCanvas.width = baseSize;
      photoCanvas.height = baseSize;
      overlayCanvas.width = baseSize;
      overlayCanvas.height = baseSize;
      render();
    }

    function renderBackground() {
      photoCtx.clearRect(0, 0, baseSize, baseSize);
      photoCtx.fillStyle = "#dfe8f1";
      photoCtx.fillRect(0, 0, baseSize, baseSize);
    }

    function drawPhoto() {
      renderBackground();

      if (!photoImg.complete || !photoImg.naturalWidth) return;

      const imgRatio = photoImg.naturalWidth / photoImg.naturalHeight;
      let drawWidth;
      let drawHeight;

      if (imgRatio > 1) {
        drawHeight = baseSize * scale;
        drawWidth = drawHeight * imgRatio;
      } else {
        drawWidth = baseSize * scale;
        drawHeight = drawWidth / imgRatio;
      }

      const x = (baseSize - drawWidth) / 2 + offsetX;
      const y = (baseSize - drawHeight) / 2 + offsetY;

      photoCtx.drawImage(photoImg, x, y, drawWidth, drawHeight);
    }

    function drawOverlay() {
      overlayCtx.clearRect(0, 0, baseSize, baseSize);
      if (!overlayImg.complete || !overlayImg.naturalWidth) return;
      overlayCtx.drawImage(overlayImg, 0, 0, baseSize, baseSize);
    }

    function render() {
      drawPhoto();
      drawOverlay();
    }

    function resetAdjustments() {
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      savedOffsetX = 0;
      savedOffsetY = 0;
      zoomInput.value = "1";
      render();
    }

    function getPointerPosition(event) {
      const rect = previewWrap.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      return {
        x: point.clientX - rect.left,
        y: point.clientY - rect.top
      };
    }

    function startDrag(event) {
      isDragging = true;
      const pos = getPointerPosition(event);
      dragStartX = pos.x;
      dragStartY = pos.y;
    }

    function moveDrag(event) {
      if (!isDragging) return;

      const pos = getPointerPosition(event);
      offsetX = savedOffsetX + ((pos.x - dragStartX) * baseSize / previewWrap.clientWidth);
      offsetY = savedOffsetY + ((pos.y - dragStartY) * baseSize / previewWrap.clientHeight);
      render();
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      savedOffsetX = offsetX;
      savedOffsetY = offsetY;
    }

    function loadImageFromFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        photoImg.onload = function() {
          resetAdjustments();
          render();
        };
        photoImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadAvatar() {
      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = baseSize;
      finalCanvas.height = baseSize;
      const finalCtx = finalCanvas.getContext("2d");

      finalCtx.drawImage(photoCanvas, 0, 0);
      finalCtx.drawImage(overlayCanvas, 0, 0);

      const link = document.createElement("a");
      link.href = finalCanvas.toDataURL("image/png");
      link.download = "avatar-marcos-pereira-1010.png";
      link.click();
    }

    previewWrap.addEventListener("mousedown", startDrag);
    previewWrap.addEventListener("mousemove", moveDrag);
    window.addEventListener("mouseup", endDrag);

    previewWrap.addEventListener("touchstart", startDrag, { passive: true });
    previewWrap.addEventListener("touchmove", moveDrag, { passive: true });
    window.addEventListener("touchend", endDrag);

    zoomInput.addEventListener("input", function() {
      scale = Number(this.value);
      render();
    });

    uploadInput.addEventListener("change", function(event) {
      const file = event.target.files && event.target.files[0];
      if (file) loadImageFromFile(file);
    });

    resetBtn.addEventListener("click", resetAdjustments);
    downloadBtn.addEventListener("click", downloadAvatar);

    overlayImg.onload = render;
    photoImg.onload = render;

    setupCanvas();

    photoImg.src = "./assets/foto-exemplo.jpeg";
    overlayImg.src = "./assets/mascara.png";
  </script>
</body>
</html>
