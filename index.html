<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#063d80"><title>Meu avatar | Marcos Pereira 1010</title<meta property="og:title" content="Marcos Pereira 1010 — Crie seu Avatar de Campanha"><meta property="og:description" content="Envie sua foto e baixe seu avatar com a máscara Eu Voto Marcos Pereira 1010."><meta property="og:image" content="/assets/foto-exemplo.jpeg"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">><style>:root{--blue:#063d80;--blue-dark:#032b60;--yellow:#ffe800;--purple:#25177d;--ink:#11213b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0%,#edf6fd 100%)}.hero{padding:32px 20px 64px;overflow:hidden}.wrap{width:min(1120px,100%);margin:auto}.brand{display:flex;justify-content:center;align-items:center;gap:12px;color:var(--blue);font-weight:900;font-size:15px;letter-spacing:.7px;text-align:center}.brand .number{color:var(--purple);background:var(--yellow);padding:6px 12px;transform:skew(-8deg);font-size:21px;line-height:1}h1{max-width:810px;margin:32px auto 14px;font-size:clamp(32px,5vw,56px);line-height:1.03;text-align:center;color:var(--blue-dark);letter-spacing:-1.8px}.lead{max-width:650px;margin:0 auto 32px;text-align:center;font-size:18px;line-height:1.5;color:#45536a}.maker{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;max-width:900px;margin:auto}.preview-card,.control-card{border-radius:24px;background:#fff;box-shadow:0 18px 45px rgba(4,44,95,.14)}.preview-card{padding:18px}.canvas-wrap{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:16px;background:linear-gradient(145deg,#e7eff7,#c7d4de);touch-action:none;user-select:none}canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.overlay{pointer-events:none}.control-card{padding:28px}.control-card h2{margin:0 0 8px;font-size:24px;color:var(--blue-dark)}.control-card p{margin:0 0 22px;line-height:1.45;color:#536075}.button{width:100%;cursor:pointer;border:0;border-radius:12px;padding:15px 18px;background:var(--yellow);color:var(--purple);font-size:16px;font-weight:900;text-align:center;transition:transform .15s,filter .15s}.button:hover{transform:translateY(-1px);filter:brightness(.98)}.button.secondary{margin-top:12px;background:var(--blue);color:#fff}input[type=file]{display:none}.adjust{display:none;margin-top:24px}.adjust.show{display:block}label.range-label{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#465873;margin:14px 0 7px}input[type=range]{width:100%;accent-color:var(--blue)}.hint{margin-top:18px!important;font-size:13px}.sample{margin-top:16px;font-size:13px;color:#5c6a7b;text-align:center}.sample button{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;font:inherit;font-weight:bold}.steps{padding:12px 20px 68px}.steps h2{text-align:center;color:var(--blue-dark);font-size:30px;margin:0 0 28px}.step-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:auto}.step{border-radius:18px;background:#fff;padding:24px;box-shadow:0 8px 24px rgba(4,44,95,.08);text-align:center}.step b{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--purple);background:var(--yellow);font-size:20px;margin-bottom:12px}.step h3{margin:0 0 8px;color:var(--blue-dark);font-size:18px}.step p{margin:0;color:#526077;line-height:1.45}footer{background:var(--blue-dark);color:#fff;padding:22px;text-align:center;font-size:14px}@media(max-width:760px){.hero{padding:24px 16px 44px}.maker{grid-template-columns:1fr;gap:18px}.control-card{padding:22px}.step-grid{grid-template-columns:1fr}.steps{padding:8px 16px 46px}}</style></head><body><main><section class="hero"><div class="wrap"><div class="brand"><span>DEPUTADO FEDERAL</span><span>MARCOS PEREIRA</span><span class="number">1010</span></div><h1>Coloque a campanha no seu avatar</h1><p class="lead">Envie uma foto, ajuste o enquadramento e baixe sua imagem com a máscara de Marcos Pereira Deputado Federal 1010.</p><div class="maker"><div class="preview-card"><div class="canvas-wrap" id="canvasWrap"><canvas id="photoCanvas"></canvas><canvas id="maskCanvas" class="overlay"></canvas></div></div><div class="control-card"><h2>Crie seu avatar</h2><p>Escolha uma foto do seu celular ou computador. Depois, arraste para posicionar e use o controle de zoom.</p><label class="button" for="photoInput">Enviar minha foto</label><input id="photoInput" type="file" accept="image/*"><div class="sample">Quer testar primeiro? <button id="useExample" type="button">Usar foto de exemplo</button></div><div class="adjust" id="adjustments"><label class="range-label" for="zoom"><span>Zoom</span><span id="zoomValue">100%</span></label><input id="zoom" type="range" min="70" max="220" value="100"><button class="button secondary" id="downloadBtn" type="button">Baixar meu avatar</button><button class="button secondary" id="resetBtn" type="button" style="background:#64748b">Centralizar foto</button></div><p class="hint">A imagem é processada apenas no seu dispositivo; ela não é enviada para um servidor.</p></div></div></div></section><section class="steps"><div class="wrap"><h2>É rápido e simples</h2><div class="step-grid"><article class="step"><b>1</b><h3>Envie sua foto</h3><p>Escolha uma imagem da sua galeria ou do computador.</p></article><article class="step"><b>2</b><h3>Ajuste o rosto</h3><p>Arraste a foto e aproxime ou afaste até ficar como desejar.</p></article><article class="step"><b>3</b><h3>Baixe e publique</h3><p>Use o arquivo gerado como foto de perfil nas suas redes sociais.</p></article></div></div></section></main><footer>Marcos Pereira — Deputado Federal 1010</footer><script>(()=>{const size=1080,pc=document.getElementById('photoCanvas'),mc=document.getElementById('maskCanvas'),p=pc.getContext('2d'),m=mc.getContext('2d');[pc,mc].forEach(c=>{c.width=size;c.height=size});const input=document.getElementById('photoInput'),zoom=document.getElementById('zoom'),zv=document.getElementById('zoomValue'),adj=document.getElementById('adjustments'),wrap=document.getElementById('canvasWrap');let photo,mask,base=1,scale=1,x=size/2,y=size/2,sx,sy,ox,oy,drag=false;const maskSrc='/assets/mascara.jpeg',exampleSrc='/assets/foto-exemplo.jpeg';function placeholder(){p.clearRect(0,0,size,size);const g=p.createLinearGradient(0,0,size,size);g.addColorStop(0,'#dce8f1');g.addColorStop(1,'#9eb7cd');p.fillStyle=g;p.fillRect(0,0,size,size);p.fillStyle='rgba(255,255,255,.88)';p.textAlign='center';p.font='700 44px Arial';p.fillText('ENVIE SUA FOTO',size/2,size/2-15);p.font='30px Arial';p.fillText('para criar seu avatar',size/2,size/2+35)}function draw(){if(!photo)return placeholder();p.clearRect(0,0,size,size);p.save();p.translate(x,y);p.scale(scale,scale);p.drawImage(photo,-photo.width/2,-photo.height/2);p.restore()}function reset(){if(!photo)return;base=Math.max(size/photo.width,size/photo.height);scale=base*(+zoom.value/100);x=size/2;y=size/2;draw()}function load(src){const i=new Image();i.onload=()=>{photo=i;zoom.value=100;zv.textContent='100%';adj.classList.add('show');reset()};i.onerror=()=>alert('A foto de exemplo ainda não foi adicionada ao projeto.');i.src=src}function pos(e){const r=wrap.getBoundingClientRect();return{x:(e.clientX-r.left)*size/r.width,y:(e.clientY-r.top)*size/r.height}}wrap.addEventListener('pointerdown',e=>{if(!photo)return;drag=true;wrap.setPointerCapture(e.pointerId);const q=pos(e);sx=q.x;sy=q.y;ox=x;oy=y});wrap.addEventListener('pointermove',e=>{if(!drag)return;const q=pos(e);x=ox+q.x-sx;y=oy+q.y-sy;draw()});wrap.addEventListener('pointerup',()=>drag=false);input.onchange=e=>{const f=e.target.files[0];if(f)load(URL.createObjectURL(f))};document.getElementById('useExample').onclick=()=>load(exampleSrc);zoom.oninput=()=>{zv.textContent=zoom.value+'%';if(photo){const old=scale;scale=base*(+zoom.value/100);const f=scale/old;x=size/2+(x-size/2)*f;y=size/2+(y-size/2)*f;draw()}};document.getElementById('resetBtn').onclick=reset;document.getElementById('downloadBtn').onclick=()=>{if(!photo)return;const o=document.createElement('canvas');o.width=size;o.height=size;const c=o.getContext('2d');c.drawImage(pc,0,0);c.drawImage(mc,0,0);const a=document.createElement('a');a.download='meu-avatar-marcos-pereira-1010.png';a.href=o.toDataURL('image/png');a.click()};const mi=new Image();mi.onload=()=>{mask=mi;m.drawImage(mask,0,0,size,size)};mi.src=maskSrc;placeholder()})();</script></body></html>
